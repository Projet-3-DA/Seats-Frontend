# Seats en production sur le serveur du département (#19).
#
# Une seule adresse publique : Caddy reçoit tout le trafic et envoie /api et /socket.io au backend,
# le reste au frontend. Le navigateur (et l'app mobile) n'ont donc qu'une URL à connaître : SEATS_URL.
#
# Lancement, depuis la racine du dépôt (voir docs/07-deploiement.md) :
#   docker compose -f deploy/compose.prod.yml --env-file deploy/.env up -d --build
#
# Différences avec compose.yml (développement) :
# - le backend est construit depuis la branche main de Seats-Backend (pas un tag figé) ;
# - l'adresse de l'API est figée dans le bundle web au build (EXPO_PUBLIC_API_URL = SEATS_URL/api) ;
# - seul Caddy publie un port ; la base, le backend et le frontend restent sur le réseau Docker privé ;
# - les conteneurs redémarrent seuls après un plantage ou un redémarrage du serveur ;
# - JWT_SECRET et le mot de passe de la base sont obligatoires (pas de valeur par défaut).

name: seats-prod

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: seats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans deploy/.env}
      POSTGRES_DB: seats
    volumes:
      - seats_prod_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seats -d seats']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: seats-backend:prod
    restart: unless-stopped
    build:
      context: https://github.com/Projet-3-DA/Seats-Backend.git#${BACKEND_REF:-main}:backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://seats:${POSTGRES_PASSWORD}@db:5432/seats
      DIRECT_URL: postgresql://seats:${POSTGRES_PASSWORD}@db:5432/seats
      JWT_SECRET: ${JWT_SECRET:?à définir dans deploy/.env}
      # Affiches (Supabase Storage) : facultatif, l'envoi d'affiche est refusé si vide.
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-affiches}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: seats-frontend:prod
    restart: unless-stopped
    build:
      context: ../frontend
      args:
        EXPO_PUBLIC_API_URL: ${SEATS_URL:?à définir dans deploy/.env}/api
    depends_on:
      - backend

  caddy:
    image: seats-caddy:prod
    restart: unless-stopped
    # Caddyfile copié dans l'image plutôt que monté : il est déployé comme le reste du code.
    build:
      context: .
      dockerfile_inline: |
        FROM caddy:2
        COPY Caddyfile /etc/caddy/Caddyfile
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  seats_prod_db:
  caddy_data:
  caddy_config:
