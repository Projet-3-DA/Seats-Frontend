name: CI

on:
  push:
    branches: [main]
    tags: ['latest', 'alpha-v1']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer le lint
        run: npm run lint

      - name: Lancer les tests
        run: npm test -- --ci

      # Vérifie que l'app se construit toujours (SSR web), sans lancer le serveur ni le backend.
      - name: Construire le bundle web
        run: npx expo export -p web

  # Construit l'image Docker et la publie sur ghcr.io. Ne tourne que si "test" a réussi, et seulement
  # quand on pousse le tag "latest" ou "alpha-v1" — pas à chaque push sur main. "latest" est mobile :
  # pour publier une nouvelle image, `git tag -f latest && git push origin latest --force` — même
  # schéma que le backend. "alpha-v1" est fixe, posé une seule fois pour la remise.
  image:
    needs: test
    if: github.ref == 'refs/tags/latest' || github.ref == 'refs/tags/alpha-v1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publier dans ghcr.io
    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN est fourni par GitHub à chaque exécution : pas de secret à créer. Le nom du
      # propriétaire doit être en minuscules pour ghcr.io.
      - name: Se connecter au registre
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Deux tags Docker : celui du tag Git poussé (`latest` ou `alpha-v1`) et `sha-xxxxxxx`, figé sur ce commit.
      - name: Construire et publier l'image
        run: |
          OWNER=${GITHUB_REPOSITORY_OWNER,,}
          SHA=sha-${GITHUB_SHA::7}
          TAG=${GITHUB_REF_NAME}

          docker build -f frontend/Dockerfile \
            -t ghcr.io/$OWNER/seats-frontend:$TAG \
            -t ghcr.io/$OWNER/seats-frontend:$SHA \
            frontend
          docker push --all-tags ghcr.io/$OWNER/seats-frontend
